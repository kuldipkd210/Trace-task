name: Build TraceTask Multi-Platform

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Linux (Ubuntu) Build
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libayatana-appindicator3-dev libnotify-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Package Linux Binary
        run: |
          cp assets/com.tracetask.tracetask.desktop build/linux/x64/release/bundle/ 2>/dev/null || true
          tar -czvf tracetask-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracetask-linux
          path: tracetask-linux-x64.tar.gz

  # -------------------------------------------------------------
  # macOS Build
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          (cd build/macos/Build/Products/Release && zip -r "$GITHUB_WORKSPACE/tracetask-macos.zip" TraceTask.app)

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracetask-macos
          path: tracetask-macos.zip

  # -------------------------------------------------------------
  # Windows Build
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath tracetask-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracetask-windows
          path: tracetask-windows-x64.zip

  # -------------------------------------------------------------
  # GitHub Release (Runs on git tag push)
  # -------------------------------------------------------------
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: tracetask-linux
          path: .

      - name: Download macOS Bundle
        uses: actions/download-artifact@v4
        with:
          name: tracetask-macos
          path: .

      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: tracetask-windows
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tracetask-linux-x64.tar.gz
            tracetask-macos.zip
            tracetask-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true

